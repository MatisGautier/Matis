<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Dancing+Script:wght@600&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
@page{size:100cm 30cm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;height:300px}
body{background:#FEF5F6;font-family:Quicksand,sans-serif;overflow:hidden;position:relative}
.frame{position:absolute;inset:10px;border:2px solid #E07590;border-radius:18px}
.frame2{position:absolute;inset:16px;border:1px dashed #EDB0C0;border-radius:13px}
.logo{position:absolute;left:34px;top:22px;height:256px}
.txt{position:absolute;left:300px;right:50px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-family:Lora,serif;font-weight:700;color:#D9668A;font-size:46px;letter-spacing:4px;white-space:nowrap;text-transform:uppercase;line-height:1}
.tag{font-family:'Dancing Script',cursive;color:#7A4A33;font-size:34px;margin-top:10px}
.sep{display:flex;align-items:center;gap:12px;margin:14px 0 12px;color:#E07590}
.sep i{display:block;width:120px;height:2px;background:linear-gradient(90deg,transparent,#E07590)}
.sep i:last-child{background:linear-gradient(90deg,#E07590,transparent)}
.prod{font-weight:600;color:#7A4A33;font-size:21px;letter-spacing:3px;text-transform:uppercase}
.prod b{color:#E07590;margin:0 12px}
.dot{position:absolute;border-radius:50%;background:#2b1d18}
</style></head><body>
<div class="frame"></div><div class="frame2"></div>
<img class="logo" src="logo_transparent.png">
<div class="txt">
  <h1>Les Douceurs de Titia</h1>
  <div class="tag">Biscuiterie artisanale, faite maison</div>
  <div class="sep"><i></i>♥<i></i></div>
  <div class="prod">Cookies<b>•</b>Macarons<b>•</b>Cupcakes<b>•</b>Gâteaux</div>
</div>
<!-- miettes de cookie (rappel du logo) -->
<div class="dot" style="right:44px;top:34px;width:9px;height:9px"></div>
<div class="dot" style="right:62px;top:52px;width:5px;height:5px"></div>
<div class="dot" style="right:36px;top:60px;width:4px;height:4px"></div>
<div class="dot" style="right:44px;bottom:36px;width:8px;height:8px"></div>
<div class="dot" style="right:64px;bottom:48px;width:4px;height:4px"></div>
<div class="dot" style="right:34px;bottom:58px;width:5px;height:5px"></div>
</body></html>
