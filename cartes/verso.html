<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.cookies{position:absolute;left:-14px;bottom:-8px;width:520px}
.scan{position:absolute;left:40px;top:40px;width:470px;text-align:center;color:#A8124F;transform:rotate(-4deg)}
.scan h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:104px;line-height:1}
.scan .u{width:330px;height:4px;margin:-2px auto 0;border-radius:3px;background:#A8124F;transform:rotate(-2deg)}
.scan p{font-family:'Dancing Script',cursive;font-weight:700;font-size:50px;line-height:1.1;margin-top:12px}
.qrbox{position:absolute;right:42px;top:115px;width:330px;height:330px;background:#fff;border:5px solid #E2639A;border-radius:28px;padding:22px;box-shadow:0 6px 18px rgba(170,30,90,.18)}
.qrbox img.q{width:100%;height:100%;display:block;image-rendering:pixelated}
.qrbox .ig{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px;border-radius:18px;box-shadow:0 0 0 7px #fff}
.spark{position:absolute;right:14px;top:58px}
.deco{position:absolute;left:115px;width:330px;top:300px;display:flex;align-items:center;gap:14px}.deco i{flex:1;height:2px;background:#B8235A}
</style></head><body>
<svg class="grain" width="880" height="580"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="9"/><feColorMatrix values="0 0 0 0 .93  0 0 0 0 .55  0 0 0 0 .7  0 0 0 -1.6 1.15"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<img class="cookies" src="cookies_verso_t.png">
<div class="scan"><h1>Scannez-moi</h1><div class="u"></div><p>pour retrouver mon<br>compte Instagram !</p></div>
<div class="deco"><i></i><svg width="56" height="56" viewBox="0 0 40 40" fill="none" stroke="#B8235A" stroke-width="2.2"><path d="M33 19.5a14 14 0 1 1-12.5-14 5 5 0 0 0 5.5 6 5 5 0 0 0 7 8z" stroke-linejoin="round"/><g fill="#B8235A" stroke="none"><circle cx="13" cy="15" r="2"/><circle cx="20" cy="20" r="2"/><circle cx="12" cy="24" r="2"/><circle cx="19" cy="29" r="2"/><circle cx="26" cy="26" r="1.8"/></g></svg><i></i></div>
<svg class="spark" width="80" height="80" viewBox="0 0 80 80" stroke="#A8124F" stroke-width="5" stroke-linecap="round"><line x1="18" y1="34" x2="10" y2="10"/><line x1="34" y1="44" x2="62" y2="24"/><line x1="40" y1="60" x2="72" y2="56"/></svg>
<div class="qrbox"><img class="q" src="qr.png"><div class="ig"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="#fff" stroke="none"/></svg></div></div>
</body></html>
